services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mailflare-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      postfix:
        condition: service_started
    ports:
      - "3000:3000"   # web app and JMAP
      - "25:25"       # inbound SMTP (point your domain's MX here)
    env_file: .env
    environment:
      # Local compose mongo. Production Coolify uses MONGO_URL from .env instead.
      MONGO_URL: mongodb://mongo:27017/mailflare
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys:ro

  postfix:
    build: ./deploy/postfix
    restart: unless-stopped
    env_file: .env
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys

volumes:
  mailflare-data:
  mailflare-mongo:
  postfix-dkim:
