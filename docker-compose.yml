services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mailflare-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      postfix:
        condition: service_started
    ports:
      - "3000:3000"   # web app and JMAP
      - "25:25"       # inbound SMTP (point your domain's MX here)
    env_file: .env.docker
    environment:
      # Fixed in-compose URL so a host MONGO_URL (e.g. 127.0.0.1 for local scripts) cannot override env_file.
      MONGO_URL: mongodb://mongo:27017/mailflare
      SAAS_MODE: ${SAAS_MODE:-true}
      DATA_DIR: /data
      OPENDKIM_KEYS_DIR: /etc/opendkim/keys
    volumes:
      - mailflare-data:/data
      - postfix-dkim:/etc/opendkim/keys:ro

  postfix:
    build: ./deploy/postfix
    restart: unless-stopped
    environment:
      HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      DKIM_BACKEND: opendkim
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: mail
      MAILFLARE_DATA_DIR: /mailflare-data
      POSTFIX_DOMAIN_SYNC_INTERVAL: "30"
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys

volumes:
  mailflare-data:
  mailflare-mongo:
  postfix-dkim:
