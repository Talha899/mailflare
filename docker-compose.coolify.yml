# Coolify: Docker Compose resource → this file.
# Assign the public app domain to the `mailflare` service (port 3000).
#
# Paste `.env` into Coolify Environment Variables. Do not set DATA_DIR there —
# the image already uses /mailflare-data (same path as the shared volume).
# Expose host TCP 25 (inbound), 587 (SMTP AUTH submission), 143 (IMAP) on `mailflare`.
# Optional TLS: set SMTP_TLS_KEY/CERT and expose 465/993 with SMTP_SUBMISSION_TLS_PORT / IMAPS_PORT.
#
# Outbound: `postfix` accepts submit from the compose network only.
#   SMTP_URL=smtp://postfix:587
# Domains are NEVER listed in env — Mailflare syncs every registered hostname
# into DATA_DIR/outbound/sender-domains.txt and Postfix reloads on change.
#
services:
  mailflare:
    build: .
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
      - "143:143"
      # Uncomment when SMTP_TLS_KEY / SMTP_TLS_CERT are set:
      # - "465:465"
      # - "993:993"
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys:ro
    depends_on:
      - postfix
    environment:
      MONGO_URL: ${MONGO_URL}
      SAAS_MODE: ${SAAS_MODE:-true}
      APP_URL: ${APP_URL}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET}
      SMTP_INBOUND_PORT: ${SMTP_INBOUND_PORT:-25}
      SMTP_URL: ${SMTP_URL:-smtp://postfix:587}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
    expose:
      - "3000"

  postfix:
    build: ./deploy/postfix
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys

volumes:
  mailflare-data:
  postfix-dkim:
