# Coolify: Docker Compose resource → use this file.
# Assign the public app domain to the `mailflare` service (port 3000).
# Set environment in Coolify (MONGO_URL, APP_URL, MAIL_HOSTNAME, SMTP_URL, …).
# Expose host TCP 25 for inbound SMTP on `mailflare` only.
#
# Outbound: `postfix` accepts submit from the compose network only.
#   SMTP_URL=smtp://postfix:587
# Domains are NEVER listed in env — Mailflare syncs every registered hostname
# into DATA_DIR/outbound/sender-domains.txt and Postfix reloads on change.
#
services:
  mailflare:
    build: .
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      MONGO_URL: ${MONGO_URL}
      SAAS_MODE: ${SAAS_MODE:-true}
      APP_URL: ${APP_URL}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      PORT: "3000"
      DATA_DIR: /data
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET}
      SMTP_INBOUND_PORT: ${SMTP_INBOUND_PORT:-25}
      SMTP_URL: ${SMTP_URL:-smtp://postfix:587}
      # Internal compose SMTP usually has no public CA — do not fail TLS verify.
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    volumes:
      - mailflare-data:/data
    depends_on:
      - postfix
    expose:
      - "3000"

  postfix:
    build: ./deploy/postfix
    restart: unless-stopped
    environment:
      HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      DKIM_BACKEND: opendkim
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: mail
      MAILFLARE_DATA_DIR: /mailflare-data
      POSTFIX_DOMAIN_SYNC_INTERVAL: "30"
    volumes:
      - mailflare-data:/mailflare-data
      - postfix-dkim:/etc/opendkim/keys

volumes:
  mailflare-data:
  postfix-dkim:
